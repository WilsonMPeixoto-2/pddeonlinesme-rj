<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDDE Online · 4ª CRE</title>
    <meta name="description" content="PDDE Online 2026 — Painel executivo-operacional da 4ª Coordenadoria Regional de Educação · SME-RJ" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
      @media (max-width: 1024px) {
        body:has(#login-title) main > img[aria-hidden="true"] {
          display: none;
        }

        body:has(#login-title) main::before {
          content: "";
          position: fixed;
          inset: 0;
          background-image: url("/src/assets/login-pdde-rio-4k.avif");
          background-position: 48% center;
          background-repeat: no-repeat;
          background-size: cover;
          pointer-events: none;
        }
      }
    </style>

    <!-- Anti-flash: aplica tema (dark por default) antes do paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var resolved = stored || 'dark';
          if (resolved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PDDE Online · 4ª CRE" />
    <meta property="og:description" content="Painel executivo-operacional do PDDE Online 2026 — 4ª Coordenadoria Regional de Educação · SME-RJ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDDE Online · 4ª CRE" />
    <meta name="twitter:description" content="Painel executivo-operacional do PDDE Online 2026 — 4ª CRE · SME-RJ" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
