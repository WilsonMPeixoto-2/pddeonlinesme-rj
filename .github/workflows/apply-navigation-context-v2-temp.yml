name: Apply Navigation Context V2 Temp

on:
  push:
    branches:
      - feat/painel-ficha-recursos-financeiro-v2
    paths:
      - .github/workflows/apply-navigation-context-v2-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/painel-ficha-recursos-financeiro-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Persistir filtros e contexto
        shell: python
        run: |
          from pathlib import Path
          import re

          repasses = Path('src/pages/Repasses.tsx')
          text = repasses.read_text(encoding='utf-8')
          text = text.replace('import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";')
          text = text.replace('import { Link } from "react-router-dom";', 'import { Link, useSearchParams } from "react-router-dom";')
          old = '''  const repassesQuery = useQuery(repassesFinanceirosOptions(exercicioNumero));
  const [search, setSearch] = useState("");
  const [selectedAction, setSelectedAction] = useState<string | null>(null);
  const [selectedBandId, setSelectedBandId] = useState<ValueBandOverview["id"] | null>(null);
  const [selectedDate, setSelectedDate] = useState<string | null>(null);'''
          new = '''  const repassesQuery = useQuery(repassesFinanceirosOptions(exercicioNumero));
  const [searchParams, setSearchParams] = useSearchParams();
  const [search, setSearch] = useState(() => searchParams.get("q") ?? "");
  const [selectedAction, setSelectedAction] = useState<string | null>(() => searchParams.get("acao"));
  const [selectedBandId, setSelectedBandId] = useState<ValueBandOverview["id"] | null>(() => {
    const value = searchParams.get("faixa");
    return value === "ate-3000" || value === "3000-5000" || value === "5000-8000" || value === "acima-8000"
      ? value
      : null;
  });
  const [selectedDate, setSelectedDate] = useState<string | null>(() => searchParams.get("data"));

  useEffect(() => {
    const next = new URLSearchParams();
    const term = search.trim();
    if (term) next.set("q", term);
    if (selectedAction) next.set("acao", selectedAction);
    if (selectedBandId) next.set("faixa", selectedBandId);
    if (selectedDate) next.set("data", selectedDate);
    setSearchParams(next, { replace: true });
  }, [search, selectedAction, selectedBandId, selectedDate, setSearchParams]);'''
          assert text.count(old) == 1, f'repasses state={text.count(old)}'
          text = text.replace(old, new, 1)
          old_link = 'to={`/escolas/${row.original.unidadeId}/recursos`}'
          new_link = 'to={`/escolas/${row.original.unidadeId}/recursos?return=${encodeURIComponent(`/repasses${searchParams.toString() ? `?${searchParams.toString()}` : ""}`)}`}'
          assert text.count(old_link) == 1, f'link={text.count(old_link)}'
          text = text.replace(old_link, new_link, 1)
          assert text.count('    [maxValue],\n  );') >= 1
          text = text.replace('    [maxValue],\n  );', '    [maxValue, searchParams],\n  );', 1)
          repasses.write_text(text, encoding='utf-8')

          recursos = Path('src/pages/EscolaRecursos.tsx')
          text = recursos.read_text(encoding='utf-8')
          text = text.replace('import { Link, useParams } from "react-router-dom";', 'import { Link, useParams, useSearchParams } from "react-router-dom";')
          marker = '  const exercicioNumero = Number(exercicio);\n'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + '  const [searchParams] = useSearchParams();\n  const returnParam = searchParams.get("return");\n  const returnTo = returnParam?.startsWith("/") ? returnParam : (id ? `/escolas/${id}` : "/escolas");\n', 1)
          assert text.count('to={id ? `/escolas/${id}` : "/escolas"}') == 1
          text = text.replace('to={id ? `/escolas/${id}` : "/escolas"}', 'to={returnTo}', 1)
          text = text.replace('              Ficha da unidade\n', '              {returnParam ? "Voltar aos repasses" : "Ficha da unidade"}\n', 1)
          recursos.write_text(text, encoding='utf-8')

          escola = Path('src/pages/EscolaEditar.tsx')
          text = escola.read_text(encoding='utf-8')
          text, count = re.subn(
            r'(className="inline-flex items-center rounded-md bg-primary/10 px-2 py-0\.5 text-xs font-semibold text-primary border border-primary/20">)\s*\{PROGRAMA_PADRAO === "basico" \? "PDDE BÁSICO" : `PDDE \$\{PROGRAMA_PADRAO\.toUpperCase\(\)\}`}\s*(</span>)',
            r'\1\n                    Recursos PDDE\n                  \2',
            text,
            count=1,
          )
          assert count == 1, f'badge={count}'
          escola.write_text(text, encoding='utf-8')

          for name in ['apply-navigation-context-temp.yml','apply-navigation-context-v2-temp.yml']:
            p = Path('.github/workflows') / name
            if p.exists(): p.unlink()
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/test/repasses-table-v9.test.tsx src/test/recursos-pdde-panel.test.tsx src/test/dashboard-financeiro.test.ts
      - name: Commitar contexto de navegação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Repasses.tsx src/pages/EscolaRecursos.tsx src/pages/EscolaEditar.tsx .github/workflows/apply-navigation-context-temp.yml .github/workflows/apply-navigation-context-v2-temp.yml
          git commit -m "feat: preservar contexto entre repasses e ficha"
          git push origin HEAD:feat/painel-ficha-recursos-financeiro-v2
