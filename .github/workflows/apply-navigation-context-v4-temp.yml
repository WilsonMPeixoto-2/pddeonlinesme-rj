name: Apply Navigation Context V4 Temp

on:
  push:
    branches:
      - feat/painel-ficha-recursos-financeiro-v2
    paths:
      - .github/workflows/apply-navigation-context-v4-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/painel-ficha-recursos-financeiro-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Aplicar contexto persistente e rótulo da ficha
        run: echo ' n'''.replace("' n'''", "'''")
if old not in text:
    raise SystemExit("bloco de estado de Repasses não encontrado")
text = text.replace(old, new, 1)

old_link = 'to={`/escolas/${row.original.unidadeId}/recursos`}'
new_link = 'to={`/escolas/${row.original.unidadeId}/recursos?return=${encodeURIComponent(`/repasses${searchParams.toString() ? `?${searchParams.toString()}` : ""}`)}`}'
if old_link not in text:
    raise SystemExit("link de Recursos em Repasses não encontrado")
text = text.replace(old_link, new_link, 1)
if '    [maxValue],\n  );' not in text:
    raise SystemExit("dependência de columns não encontrada")
text = text.replace('    [maxValue],\n  );', '    [maxValue, searchParams],\n  );', 1)
repasses.write_text(text, encoding="utf-8")

recursos = Path("src/pages/EscolaRecursos.tsx")
text = recursos.read_text(encoding="utf-8")
text = text.replace('import { Link, useParams } from "react-router-dom";', 'import { Link, useParams, useSearchParams } from "react-router-dom";', 1)
marker = '  const exercicioNumero = Number(exercicio);\n'
if marker not in text:
    raise SystemExit("marcador de exercício em EscolaRecursos não encontrado")
text = text.replace(marker, marker + '  const [searchParams] = useSearchParams();\n  const returnParam = searchParams.get("return");\n  const returnTo = returnParam?.startsWith("/") ? returnParam : (id ? `/escolas/${id}` : "/escolas");\n', 1)
old_to = 'to={id ? `/escolas/${id}` : "/escolas"}'
if old_to not in text:
    raise SystemExit("link de retorno em EscolaRecursos não encontrado")
text = text.replace(old_to, 'to={returnTo}', 1)
text = text.replace('              Ficha da unidade\n', '              {returnParam ? "Voltar aos repasses" : "Ficha da unidade"}\n', 1)
recursos.write_text(text, encoding="utf-8")

escola = Path("src/pages/EscolaEditar.tsx")
text = escola.read_text(encoding="utf-8")
target = '{PROGRAMA_PADRAO === "basico" ? "PDDE BÁSICO" : `PDDE ${PROGRAMA_PADRAO.toUpperCase()}`}'
if target in text:
    text = text.replace(target, "Recursos PDDE", 1)
escola.write_text(text, encoding="utf-8")
' | base64 -d | python
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/test/repasses-table-v9.test.tsx src/test/recursos-pdde-panel.test.tsx src/test/dashboard-financeiro.test.ts
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Repasses.tsx src/pages/EscolaRecursos.tsx src/pages/EscolaEditar.tsx
          git commit -m "feat: preservar contexto entre repasses e ficha"
          git push origin HEAD:feat/painel-ficha-recursos-financeiro-v2
