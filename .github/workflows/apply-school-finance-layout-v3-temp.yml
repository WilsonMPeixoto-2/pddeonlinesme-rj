name: Apply School Finance Layout V3 Temp

on:
  push:
    branches:
      - feat/painel-ficha-recursos-financeiro-v2
    paths:
      - .github/workflows/apply-school-finance-layout-v3-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/painel-ficha-recursos-financeiro-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Reorganizar ficha da unidade
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('src/pages/EscolaEditar.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace('import { Input } from "@/components/ui/input";\n', '')
          text = text.replace('import { Label } from "@/components/ui/label";\n', '')
          text = text.replace('  Landmark,\n  Coins,\n', '')
          text = text.replace('  Pencil,\n  Mail,\n', '  Pencil,\n  WalletCards,\n')
          text = text.replace('import { DocumentsPanel } from "@/components/DocumentsPanel";\n', 'import { DocumentsPanel } from "@/components/DocumentsPanel";\nimport { IdentificacaoInstitucional } from "@/components/escola/IdentificacaoInstitucional";\nimport { RecursosPDDEPanel } from "@/components/RecursosPDDEPanel";\n')
          text = text.replace('import { getErrorMessage } from "@/lib/errors";\n', 'import { getErrorMessage } from "@/lib/errors";\nimport { financeiroUnidadeOptions } from "@/lib/queryKeys";\n')

          old_sections = '''const SECTIONS = [
            { id: "identificacao", label: "Identificação", icon: User },
            { id: "bancarios", label: "Dados Bancários", icon: Landmark },
            { id: "financeiros", label: "Execução Financeira Importada", icon: Coins },
            { id: "despesas", label: "Despesas Homologadas", icon: FileText },
          ];'''.replace('          ', '')
          new_sections = '''const SECTIONS = [
            { id: "identificacao", label: "Identificação", icon: User },
            { id: "financeiros", label: "Recursos PDDE", icon: WalletCards },
            { id: "despesas", label: "Despesas Homologadas", icon: FileText },
          ];'''.replace('          ', '')
          assert text.count(old_sections) == 1
          text = text.replace(old_sections, new_sections, 1)

          text, count = re.subn(r'\nconst formatText = \(val: string \| null \| undefined, fallback = "Não informado"\) => \{\n  return val && val\.trim\(\) !== "" \? val : fallback;\n\};\n', '\n', text, count=1)
          assert count == 1
          text = text.replace('  const readOnlyInputClass = "bg-background/60 border-border/50 text-foreground cursor-default shadow-inner";\n\n  // Fase 2A: fallback visual para o padrão bancário do PDDE.\n  // A normalização persistida do campo banco será tratada em etapa própria.\n  const BANCO_PADRAO_PDDE = "Banco do Brasil";\n\n', '')
          assert text.count('.select("email")') == 1
          text = text.replace('.select("email")', '.select("email, alunos")', 1)
          marker = '  const updateCadastro = useUpdateUnidadeCadastro({'
          assert text.count(marker) == 1
          text = text.replace(marker, '  const financeiro = useQuery(financeiroUnidadeOptions(id, Number(exercicio)));\n\n' + marker, 1)

          desktop = '''{/* SECTION 1: Identificação institucional */}
                <Card id="identificacao" ref={(el) => { sectionRefs.current["identificacao"] = el; }} className="scroll-mt-32">
                  <CardContent className="p-6">
                    <SectionHeader icon={User} title="Identificação institucional" subtitle="Dados cadastrais disponíveis para a unidade" />
                    <IdentificacaoInstitucional
                      designacao={u.designacao}
                      nome={u.nome}
                      inep={u.inep}
                      cnpj={u.cnpj}
                      diretor={u.diretor}
                      email={escolaCadastral?.email}
                      endereco={u.endereco}
                      alunos={escolaCadastral?.alunos}
                    />
                  </CardContent>
                </Card>

                {/* SECTION 2: Recursos PDDE */}
                <Card id="financeiros" ref={(el) => { sectionRefs.current["financeiros"] = el; }} className="scroll-mt-32">
                  <CardContent className="p-6">
                    <SectionHeader icon={WalletCards} title="Recursos PDDE" subtitle={`Programas, ações, parcelas, contas e datas · ${exercicio}`} />
                    <RecursosPDDEPanel
                      programas={financeiro.data?.programas ?? []}
                      isLoading={financeiro.isLoading}
                      error={financeiro.isError ? financeiro.error.message : null}
                    />
                  </CardContent>
                </Card>

                {/* SECTION 3: Despesas Fiscais */}'''
          text, count = re.subn(r'\{/\* SECTION 1: Identificação \*/\}.*?\{/\* SECTION 4: Despesas Fiscais \*/\}', desktop, text, count=1, flags=re.S)
          assert count == 1, f'desktop={count}'

          mobile = '''{/* SECTION 1: Identificação institucional */}
            <Card id="identificacao-mobile" className="ds-card scroll-mt-32">
              <CardContent className="p-6">
                <SectionHeader icon={User} title="Identificação institucional" subtitle="Dados cadastrais disponíveis para a unidade" />
                <IdentificacaoInstitucional
                  designacao={u.designacao}
                  nome={u.nome}
                  inep={u.inep}
                  cnpj={u.cnpj}
                  diretor={u.diretor}
                  email={escolaCadastral?.email}
                  endereco={u.endereco}
                  alunos={escolaCadastral?.alunos}
                />
              </CardContent>
            </Card>

            {/* SECTION 2: Recursos PDDE */}
            <Card id="financeiros-mobile" className="ds-card scroll-mt-32">
              <CardContent className="p-6">
                <SectionHeader icon={WalletCards} title="Recursos PDDE" subtitle={`Programas, ações, parcelas, contas e datas · ${exercicio}`} />
                <RecursosPDDEPanel
                  programas={financeiro.data?.programas ?? []}
                  isLoading={financeiro.isLoading}
                  error={financeiro.isError ? financeiro.error.message : null}
                />
              </CardContent>
            </Card>

            {/* SECTION 3: Despesas Fiscais (Mobile) */}'''
          text, count = re.subn(r'\{/\* SECTION 1: Identificação \*/\}.*?\{/\* SECTION 4: Despesas Fiscais \(Mobile\) \*/\}', mobile, text, count=1, flags=re.S)
          assert count == 1, f'mobile={count}'

          text, count = re.subn(
            r'  const scrollTo = \(sectionId: string\) => \{\n    const el = sectionRefs\.current\[sectionId\];\n    if \(el\) el\.scrollIntoView\(\{ behavior: "smooth", block: "start" \}\);\n  \};',
            '  const scrollTo = (sectionId: string) => {\n    const mobile = window.matchMedia("(max-width: 1023px)").matches;\n    const el = mobile ? document.getElementById(`${sectionId}-mobile`) : sectionRefs.current[sectionId];\n    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });\n  };',
            text,
            count=1,
          )
          assert count == 1, f'scroll={count}'

          path.write_text(text, encoding='utf-8')
          Path('src/pages/EscolaEditarComRecursos.tsx').write_text('import EscolaEditar from "./EscolaEditar";\n\nexport default function EscolaEditarComRecursos() {\n  return <EscolaEditar />;\n}\n', encoding='utf-8')
          for name in ['apply-school-finance-layout-temp.yml','apply-school-finance-layout-v2-temp.yml','apply-school-finance-layout-v3-temp.yml']:
            temp = Path('.github/workflows') / name
            if temp.exists(): temp.unlink()
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Commitar ficha integrada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/EscolaEditar.tsx src/pages/EscolaEditarComRecursos.tsx .github/workflows/apply-school-finance-layout-temp.yml .github/workflows/apply-school-finance-layout-v2-temp.yml .github/workflows/apply-school-finance-layout-v3-temp.yml
          git commit -m "feat: integrar ficha cadastral e recursos PDDE"
          git push origin HEAD:feat/painel-ficha-recursos-financeiro-v2
