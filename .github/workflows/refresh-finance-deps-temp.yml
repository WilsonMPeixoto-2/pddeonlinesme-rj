name: Refresh Finance Dependencies (temporary)

on:
  push:
    branches:
      - maintenance/deps-financeiro-2026-09-08

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: maintenance/deps-financeiro-2026-09-08

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh dependency manifest and lockfile
        run: |
          npm install --package-lock-only @supabase/supabase-js@2.116.0 @tanstack/react-query@5.102.8 @tanstack/react-table@9.2.4
          npm install --package-lock-only --save-dev @playwright/test@1.63.0

      - name: Verify clean installation
        run: npm ci

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "[lock-sync] chore: atualizar dependências financeiras"
          git push origin HEAD:maintenance/deps-financeiro-2026-09-08
