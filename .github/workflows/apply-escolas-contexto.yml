name: Apply Escolas Navigation Context

on:
  push:
    branches:
      - feat/escolas-contexto-navegacao
    paths:
      - .github/workflows/apply-escolas-contexto.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/escolas-contexto-navegacao
          fetch-depth: 0

      - name: Apply guarded source edits
        run: python .github/scripts/apply_escolas_context.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/pages/EscolaEditar.tsx\nsrc/pages/Escolas.tsx'

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Escolas.tsx src/pages/EscolaEditar.tsx
          git commit -m "feat: preserva contexto entre carteira e ficha escolar"
          git push origin HEAD:feat/escolas-contexto-navegacao
