name: Dependency refresh validation

on:
  push:
    branches:
      - chore/dependency-modernization-2026-08

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-modernization-2026-08
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Install exact dependency graph
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        run: npm run test:e2e

      - name: Dependency audit
        continue-on-error: true
        run: npm run check:deps

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore(deps): refresh package lock [skip ci]"
            git push origin HEAD:chore/dependency-modernization-2026-08
          fi
