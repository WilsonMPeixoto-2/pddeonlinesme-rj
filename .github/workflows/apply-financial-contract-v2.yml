name: Apply Financial Contract V2

on:
  push:
    branches:
      - feat/financial-dimension-contract-v2
    paths:
      - '.github/scripts/apply_financial_contract_v2.py'
      - '.github/workflows/apply-financial-contract-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-financial-contract-v2
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/financial-dimension-contract-v2
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate guarded V2 migration
        run: python .github/scripts/apply_financial_contract_v2.py

      - name: Assert generated scope
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260911220000_financial_dimension_contract_v2.sql
          git diff --exit-code -- . ':(exclude)supabase/migrations/20260911220000_financial_dimension_contract_v2.sql'
          grep -q 'bank_balance_positions' supabase/migrations/20260911220000_financial_dimension_contract_v2.sql
          grep -q 'assert_financial_dimension_contract_v2' supabase/migrations/20260911220000_financial_dimension_contract_v2.sql

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260911220000_financial_dimension_contract_v2.sql
          if git diff --cached --quiet; then
            echo 'Migration already generated.'
            exit 0
          fi
          git commit -m 'feat: implementar contrato financeiro por dimensão v2'
          git push origin HEAD:feat/financial-dimension-contract-v2
