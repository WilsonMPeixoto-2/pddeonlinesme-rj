name: Finalize Navigation Context Temp

on:
  push:
    branches:
      - feat/painel-ficha-recursos-financeiro-v2
    paths:
      - .github/workflows/finalize-navigation-context-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/painel-ficha-recursos-financeiro-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Corrigir IDs de faixa e retorno seguro
        run: |
          python - <<'PY'
          from pathlib import Path

          repasses = Path('src/pages/Repasses.tsx')
          text = repasses.read_text(encoding='utf-8')
          old = 'return value === "ate-3000" || value === "3000-5000" || value === "5000-8000" || value === "acima-8000"'
          new = 'return value === "ate-3" || value === "3-5" || value === "5-8" || value === "acima-8"'
          if old not in text:
              raise SystemExit('IDs antigos de faixa não encontrados')
          repasses.write_text(text.replace(old, new, 1), encoding='utf-8')

          recursos = Path('src/pages/EscolaRecursos.tsx')
          text = recursos.read_text(encoding='utf-8')
          old = 'const returnTo = returnParam?.startsWith("/") ? returnParam : (id ? `/escolas/${id}` : "/escolas");'
          new = 'const returnTo = returnParam?.startsWith("/") && !returnParam.startsWith("//") ? returnParam : (id ? `/escolas/${id}` : "/escolas");'
          if old not in text:
              raise SystemExit('guarda de retorno não encontrada')
          recursos.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/test/repasses-table-v9.test.tsx src/test/recursos-pdde-panel.test.tsx src/test/dashboard-financeiro.test.ts
      - name: Commitar e remover workflow temporário
        run: |
          rm .github/workflows/finalize-navigation-context-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Repasses.tsx src/pages/EscolaRecursos.tsx .github/workflows/finalize-navigation-context-temp.yml
          git commit -m "fix: finalizar contexto persistente de repasses"
          git push origin HEAD:feat/painel-ficha-recursos-financeiro-v2
