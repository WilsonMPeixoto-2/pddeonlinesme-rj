name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vercel deployment policy
        run: node scripts/vercel-ignore-build.mjs --self-test

      - name: Vercel upload contract
        run: |
          if git check-ignore -q --no-index --exclude-from=.vercelignore src/integrations/supabase/client.ts; then
            echo "::error::.vercelignore está excluindo o cliente Supabase usado pelo frontend"
            exit 1
          fi
          if git check-ignore -q --no-index --exclude-from=.vercelignore src/integrations/supabase/types.ts; then
            echo "::error::.vercelignore está excluindo os tipos Supabase usados pelo frontend"
            exit 1
          fi

      - name: Login institutional image contract
        run: |
          test -f src/assets/login-pdde-rio.webp
          expected="edafb0757e3d689545c4a67dc1385dd59319f070ef69848fde4d13deee009038"
          actual=$(sha256sum src/assets/login-pdde-rio.webp | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::A composição institucional aprovada do login foi alterada ($actual)"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        timeout-minutes: 10
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Demonstrativo template audit
        run: npm run audit:demonstrativo:template

      - name: Build
        run: npm run build

      - name: Initial bundle budget
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Production dependency hygiene (Knip)
        continue-on-error: true
        run: npm run check:deps:prod

      - name: Production vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  database-contract:
    name: Supabase financial publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Rebuild database from migrations
        run: npx supabase db reset --local

      - name: Database contract tests
        run: npx supabase test db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
