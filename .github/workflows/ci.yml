name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Demonstrativo template audit
        run: npm run audit:demonstrativo:template

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        run: npm run test:e2e

      - name: Production dependency audit
        continue-on-error: true
        run: npm run check:deps:prod
