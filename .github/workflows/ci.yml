name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        timeout-minutes: 10
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Demonstrativo template audit
        run: npm run audit:demonstrativo:template

      - name: Build
        run: npm run build

      - name: Initial bundle budget
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Production dependency hygiene (Knip)
        continue-on-error: true
        run: npm run check:deps:prod

      - name: Production vulnerability audit
        run: npm audit --omit=dev --audit-level=high
