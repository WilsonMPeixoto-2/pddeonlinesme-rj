name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile for hygiene PR
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/dependency-hygiene-phase3'
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Persist refreshed lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/dependency-hygiene-phase3'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore(deps): refresh lock after hygiene [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Demonstrativo template audit
        run: npm run audit:demonstrativo:template

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        run: npm run test:e2e

      - name: Production dependency audit
        continue-on-error: true
        run: npm run check:deps:prod
