name: Apply Repasses Sorting Hotfix Temp

on:
  push:
    branches:
      - feat/layout-financeiro-repasses-v2
    paths:
      - .github/workflows/apply-repasses-sorting-hotfix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/layout-financeiro-repasses-v2
      - name: Aplicar configuração correta de sorting v9
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/Repasses.tsx')
          text = path.read_text(encoding='utf-8')
          old_features = '''const repassesTableFeatures = tableFeatures({
            sorting: rowSortingFeature,
          });'''.replace('            ', '')
          new_features = '''const repassesTableFeatures = tableFeatures({
            rowSortingFeature,
            sortedRowModel: createSortedRowModel(),
          });'''.replace('            ', '')
          assert text.count(old_features) == 1, f'feature matches: {text.count(old_features)}'
          text = text.replace(old_features, new_features)
          old_state = '''initialState: {
            sorting: {
              sortBy: [{ id: "valorPago", desc: true }],
            },
          },
          getSortedRowModel: createSortedRowModel(),'''.replace('          ', '')
          new_state = '''initialState: {
            sorting: [{ id: "valorPago", desc: true }],
          },'''.replace('          ', '')
          assert text.count(old_state) == 1, f'state matches: {text.count(old_state)}'
          text = text.replace(old_state, new_state)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-repasses-sorting-hotfix-temp.yml').unlink()
      - name: Commitar correção e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Repasses.tsx .github/workflows/apply-repasses-sorting-hotfix-temp.yml
          git commit -m "fix: alinhar sorting de Repasses ao TanStack Table v9"
          git push origin HEAD:feat/layout-financeiro-repasses-v2
