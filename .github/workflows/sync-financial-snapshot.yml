name: Validate Financial Snapshot Contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-financial-snapshot.mjs'
      - 'scripts/lib/financial-publication.mjs'
      - 'supabase/functions/_shared/financial-publication.mjs'
      - 'supabase/functions/sync_pdde_financial_snapshot/**'
      - 'supabase/migrations/**'
      - '.github/workflows/sync-financial-snapshot.yml'
  repository_dispatch:
    types:
      - financial-snapshot-published-v1

concurrency:
  group: validate-financial-snapshot-contract
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate financial snapshot contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository || '' }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflowRunId || '' }}
      EXPECTED_ARTIFACT_ID: ${{ github.event.client_payload.artifactId || '' }}
      EXPECTED_ARTIFACT_NAME: ${{ github.event.client_payload.artifactName || '' }}
      EXPECTED_PUBLISHED_AT: ${{ github.event.client_payload.publishedAt || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate current snapshot without privileged publication
        run: npm run sync:financial:snapshot -- --dry-run
