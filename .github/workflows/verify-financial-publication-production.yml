name: Verify Financial Publication Production

on:
  push:
    branches:
      - feat/financial-publication-pipeline-v1

concurrency:
  group: verify-financial-publication-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Dry-run, publish and prove idempotence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.PDDE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PDDE_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate destination
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = "https://raluxyojqosfzrfozmpz.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Validate current published snapshot without writing
        run: node scripts/sync-financial-snapshot.mjs --dry-run

      - name: Publish current mature snapshot
        shell: bash
        run: |
          set -euo pipefail
          output="$(node scripts/sync-financial-snapshot.mjs)"
          printf '%s\n' "$output"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.result?.status !== "published") { console.error(`expected published, got ${x.result?.status}`); process.exit(1); }' "$output"

      - name: Re-run same snapshot and require strict idempotence
        shell: bash
        run: |
          set -euo pipefail
          output="$(node scripts/sync-financial-snapshot.mjs)"
          printf '%s\n' "$output"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.result?.status !== "idempotent") { console.error(`expected idempotent, got ${x.result?.status}`); process.exit(1); }' "$output"
