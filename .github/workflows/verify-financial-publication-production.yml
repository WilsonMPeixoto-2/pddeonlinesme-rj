name: Verify Financial Publication Production

on:
  push:
    branches:
      - feat/financial-publication-pipeline-v1

concurrency:
  group: verify-financial-publication-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Validate real published snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch, hydrate and validate current published snapshot
        shell: bash
        run: |
          set -euo pipefail
          output="$(node scripts/sync-financial-snapshot.mjs --dry-run)"
          printf '%s\n' "$output"
          node -e '
            const x = JSON.parse(process.argv[1]);
            if (x.mode !== "dry-run") throw new Error("dry-run ausente");
            if (x.exercise !== 2026) throw new Error(`exercicio inesperado: ${x.exercise}`);
            if (x.schools !== 163) throw new Error(`escolas: ${x.schools}`);
            if (x.dimensions?.length !== 5) throw new Error(`dimensoes: ${x.dimensions?.length}`);
            for (const d of x.dimensions) {
              if (d.coverage !== "163/163" || d.quality !== "MATURE") {
                throw new Error(`${d.key}: ${d.coverage}/${d.quality}`);
              }
            }
            if (!/^[0-9a-f]{64}$/.test(x.snapshotDigest ?? "")) throw new Error("digest invalido");
          ' "$output"
