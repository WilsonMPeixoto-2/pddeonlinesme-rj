name: Apply Repasses Hotfix Temp

on:
  push:
    branches:
      - feat/layout-financeiro-repasses-v2
    paths:
      - .github/workflows/apply-repasses-hotfix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/layout-financeiro-repasses-v2
      - name: Aplicar correção mínima
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/Repasses.tsx')
          text = path.read_text(encoding='utf-8')
          old_header = 'table.FlexRender(header.column.columnDef.header, header.getContext())'
          old_cell = 'table.FlexRender(cell.column.columnDef.cell, cell.getContext())'
          assert text.count(old_header) == 1, f'header matches: {text.count(old_header)}'
          assert text.count(old_cell) == 1, f'cell matches: {text.count(old_cell)}'
          text = text.replace(old_header, '<table.FlexRender header={header} />')
          text = text.replace(old_cell, '<table.FlexRender cell={cell} />')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-repasses-hotfix-temp.yml').unlink()
      - name: Commitar hotfix e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Repasses.tsx .github/workflows/apply-repasses-hotfix-temp.yml
          git commit -m "fix: corrigir FlexRender da tabela de repasses"
          git push origin HEAD:feat/layout-financeiro-repasses-v2
