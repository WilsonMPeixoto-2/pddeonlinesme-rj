name: Refresh final dependencies temp

on:
  push:
    branches:
      - maintenance/deps-2026-09-09-final

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/deps-2026-09-09-final
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Atualizar manifesto e lockfile de forma coerente
        run: |
          npm install --package-lock-only --save-dev eslint@10.10.0 jsdom@30.0.1 vitest@5.0.0 @vitest/coverage-v8@5.0.0
          npm ci
      - name: Verificação rápida antes do commit
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:coverage
          npm run build
      - name: Commit do lockfile gerado pelo npm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de dependências."
            exit 0
          fi
          git commit -m "[deps-sync] chore: alinhar ferramentas de teste e lint"
          git push origin HEAD:maintenance/deps-2026-09-09-final
