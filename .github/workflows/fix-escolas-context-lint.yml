name: Fix Escolas Context Lint

on:
  push:
    branches:
      - feat/escolas-contexto-navegacao
    paths:
      - .github/workflows/fix-escolas-context-lint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/escolas-contexto-navegacao
          fetch-depth: 0

      - name: Apply guarded fix
        run: python .github/scripts/fix_escolas_context_lint.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/pages/EscolaEditar.tsx\nsrc/pages/Escolas.tsx'

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Escolas.tsx src/pages/EscolaEditar.tsx
          git commit -m "fix: estabiliza contexto da carteira no React Compiler"
          git push origin HEAD:feat/escolas-contexto-navegacao
