name: Apply Navigation Context V5 Temp

on:
  push:
    branches:
      - feat/painel-ficha-recursos-financeiro-v2
    paths:
      - .github/workflows/apply-navigation-context-v5-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/painel-ficha-recursos-financeiro-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Aplicar contexto persistente e rótulo da ficha
        run: echo '' | base64 -d | python
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/test/repasses-table-v9.test.tsx src/test/recursos-pdde-panel.test.tsx src/test/dashboard-financeiro.test.ts
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Repasses.tsx src/pages/EscolaRecursos.tsx src/pages/EscolaEditar.tsx
          git commit -m "feat: preservar contexto entre repasses e ficha"
          git push origin HEAD:feat/painel-ficha-recursos-financeiro-v2
