name: Dependency lock repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-fast-uri:
    if: github.head_ref == 'chore/dependency-refresh-policy-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible audit fixes to the lockfile
        run: |
          npm update fast-uri --package-lock-only
          npm audit fix --package-lock-only || true

      - name: Verify production high-severity audit
        run: npm audit --omit=dev --audit-level=high

      - name: Show repaired lockfile versions
        run: |
          node -e "const p=require('./package-lock.json').packages; for (const [k,v] of Object.entries(p)) if (/fast-uri$|brace-expansion$/.test(k)) console.log(k, v.version)"

      - name: Commit repaired lockfile to PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already contains the compatible security repairs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: reparar dependencias transitivas vulneraveis"
          git push origin HEAD:"${GITHUB_HEAD_REF}"

      - name: Upload repaired lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repaired-package-lock
          path: package-lock.json
          retention-days: 1